name: Hourly Binance Square News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-binance-square-news
  cancel-in-progress: false

jobs:
  trigger-news:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate required secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "::error title=Missing CRON_SECRET::GitHub Actions secret CRON_SECRET is unavailable to this workflow."
            echo "Add/update CRON_SECRET in repository Settings > Secrets and variables > Actions."
            echo "Use the same value as Vercel Project Settings > Environment Variables for Production."
            exit 1
          fi
          echo "CRON_SECRET is present (value intentionally not displayed)."
      - name: Trigger protected production news endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEWS_ENDPOINT: https://binancesquare.vercel.app/api/cron-news
        shell: bash
        run: |
          set -euo pipefail
          # No automatic retries: an ambiguous publishing response must not
          # cause a duplicate Binance post.
          http_code="$(curl --silent --show-error \
            --max-time 70 \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${NEWS_ENDPOINT}")" || {
              echo "::error::Request failed before an HTTP response was confirmed; inspect durable lastNewsRun before retrying."
              exit 1
            }
          cat response.json
          echo
          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Production endpoint returned HTTP ${http_code}."
            exit 1
          fi
          echo "Production endpoint returned HTTP ${http_code}."
